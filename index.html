
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">

  <title>Chigozirim Wilson Weli | Frontend Developer, UI/UX Designer & AI Specialist</title>

  <meta name="description" content="Official portfolio of Chigozirim Wilson Weli, Frontend Developer, UI/UX Designer and AI Specialist with over two decades of experience.">
  <meta name="keywords" content="Chigozirim Wilson Weli, Frontend Developer, UI UX Designer, AI Specialist, Prompt Engineering, Web Development, Port Harcourt">
  <meta name="author" content="Chigozirim Wilson Weli">
  <meta name="robots" content="index, follow">

  <meta property="og:title" content="Chigozirim Wilson Weli | Professional Portfolio">
  <meta property="og:description" content="Frontend Developer | UI/UX Designer | AI Specialist">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ================================
       1. GLOBAL VARIABLES
    ================================= */

    :root {
      --bg: #07111f;
      --bg-secondary: #0b192a;
      --card: #102238;
      --card-hover: #142c45;
      --text: #f4f8ff;
      --muted: #9eafc4;
      --accent: #00d5ff;
      --accent-two: #477bff;
      --border: rgba(255,255,255,0.09);
      --shadow: 0 15px 45px rgba(0,0,0,0.25);
      --header: rgba(7,17,31,0.88);
    }

    body.light-mode {
      --bg: #f4f7fc;
      --bg-secondary: #eaf0f8;
      --card: #ffffff;
      --card-hover: #edf5ff;
      --text: #10233c;
      --muted: #5d6e83;
      --accent: #007da8;
      --accent-two: #315be7;
      --border: rgba(16,35,60,0.12);
      --shadow: 0 15px 45px rgba(20,40,70,0.09);
      --header: rgba(244,247,252,0.9);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 85px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }

    h1, h2, h3, h4 {
      font-family: 'Space Grotesk', sans-serif;
      line-height: 1.2;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    img {
      max-width: 100%;
    }

    .container {
      width: min(1150px, 90%);
      margin: auto;
    }

    .section {
      padding: 105px 0;
    }

    .section-heading {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 55px;
    }

    .section-heading span,
    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .section-heading h2 {
      font-size: clamp(30px, 5vw, 43px);
      margin: 12px 0;
    }

    .section-heading p {
      color: var(--muted);
    }

    .gradient-text {
      background: linear-gradient(100deg, var(--accent), #7799ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 13px 23px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      transition: 0.3s;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: linear-gradient(110deg, #00bfe9, #416eff);
      color: white;
      box-shadow: 0 8px 25px rgba(0,190,240,0.18);
    }

    .btn-primary:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0,190,240,0.3);
    }

    .btn-outline {
      border-color: var(--border);
      color: var(--text);
      background: transparent;
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ================================
       2. HEADER AND NAVIGATION
    ================================= */

    header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      background: var(--header);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }

    .navbar {
      min-height: 76px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 23px;
      letter-spacing: -1px;
    }

    .logo span {
      color: var(--accent);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 27px;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      list-style: none;
    }

    .nav-links a {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .theme-toggle,
    .menu-toggle {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      background: var(--card);
      font-size: 19px;
    }

    .menu-toggle {
      display: none;
    }

    /* ================================
       3. HERO SECTION
    ================================= */

    .hero {
      min-height: 100vh;
      padding: 140px 0 80px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: rgba(0,180,255,0.10);
      filter: blur(100px);
      top: 10%;
      right: -150px;
      pointer-events: none;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 65px;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-badge {
      display: inline-flex;
      gap: 9px;
      align-items: center;
      background: rgba(0,213,255,0.08);
      border: 1px solid rgba(0,213,255,0.25);
      color: var(--accent);
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #35dc92;
      border-radius: 50%;
      box-shadow: 0 0 12px #35dc92;
    }

    .hero h1 {
      font-size: clamp(38px, 5.5vw, 66px);
      letter-spacing: -2px;
      margin-bottom: 15px;
    }

    .hero h2 {
      font-size: clamp(17px, 2vw, 23px);
      color: var(--muted);
      font-weight: 500;
      min-height: 35px;
      margin-bottom: 23px;
    }

    .hero-description {
      max-width: 600px;
      color: var(--muted);
      margin-bottom: 30px;
      font-size: 15px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .hero-image-wrapper {
      position: relative;
      max-width: 390px;
      margin: auto;
      width: 100%;
    }

    .hero-image-frame {
      aspect-ratio: 4/5;
      border-radius: 22px;
      border: 1px solid rgba(0,213,255,0.4);
      background: linear-gradient(145deg, #132f4b, #081421);
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(0,180,255,0.12);
    }

    /* Replace the placeholder with your portrait.
       Add your image as hero.jpg in the same folder.
       Then replace the placeholder div with:
       <img src="hero.jpg" alt="Chigozirim Wilson Weli">
    */

    .hero-placeholder {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 30px;
      background:
        radial-gradient(circle at 50% 35%, rgba(0,213,255,0.18), transparent 45%),
        linear-gradient(145deg, #142d49, #07111f);
    }

    .placeholder-icon {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
      color: var(--accent);
      box-shadow: 0 0 35px rgba(0,213,255,0.2);
      margin-bottom: 25px;
    }

    .hero-placeholder p {
      color: #a6dff0;
      font-size: 13px;
    }

    .floating-card {
      position: absolute;
      bottom: 25px;
      left: -45px;
      background: var(--card);
      padding: 14px 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .floating-card strong {
      display: block;
      font-size: 21px;
      color: var(--accent);
    }

    .floating-card small {
      color: var(--muted);
    }

    /* ================================
       4. ABOUT SECTION
    ================================= */

    .about {
      background: var(--bg-secondary);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 55px;
      align-items: center;
    }

    .about-content h3 {
      font-size: 29px;
      margin-bottom: 20px;
    }

    .about-content p {
      color: var(--muted);
      margin-bottom: 17px;
    }

    .about-highlight {
      border-left: 3px solid var(--accent);
      padding: 17px 20px;
      background: var(--card);
      border-radius: 0 10px 10px 0;
      margin-top: 25px;
    }

    .about-highlight p {
      margin: 0;
      font-weight: 600;
    }

    .about-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .stat-card {
      padding: 27px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-align: center;
    }

    .stat-card h3 {
      font-size: 32px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .stat-card p {
      font-size: 12px;
      color: var(--muted);
    }

    /* ================================
       5. SKILLS
    ================================= */

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }

    .skill-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 27px;
      transition: 0.3s;
    }

    .skill-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
    }

    .skill-card h3 {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .skill-item {
      margin-bottom: 17px;
    }

    .skill-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .skill-info span:last-child {
      color: var(--accent);
    }

    .skill-track {
      height: 6px;
      background: var(--bg);
      border-radius: 20px;
      overflow: hidden;
    }

    .skill-progress {
      width: 0;
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, #00bfe9, #477bff);
      transition: width 1.6s ease;
    }

    .tool-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 30px;
    }

    .tool-tags span {
      padding: 9px 15px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    /* ================================
       6. PROJECTS
    ================================= */

    .projects {
      background: var(--bg-secondary);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .project-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: 0.3s;
    }

    .project-card:hover {
      transform: translateY(-7px);
      border-color: var(--accent);
    }

    .project-visual {
      height: 190px;
      background:
        radial-gradient(circle at center, rgba(0,213,255,0.16), transparent 65%),
        linear-gradient(135deg, #17324f, #081421);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
      color: var(--accent);
    }

    .project-details {
      padding: 22px;
    }

    .project-details h3 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .project-details p {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 17px;
    }

    .project-details a {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }

    /* ================================
       7. CERTIFICATIONS
    ================================= */

    .cert-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }

    .cert-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 25px;
      display: flex;
      gap: 18px;
      align-items: flex-start;
    }

    .cert-icon {
      min-width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(0,213,255,0.10);
      color: var(--accent);
      display: grid;
      place-items: center;
      font-size: 23px;
    }

    .cert-card h3 {
      font-size: 17px;
      margin-bottom: 8px;
    }

    .cert-card p {
      color: var(--muted);
      font-size: 13px;
    }

    .cert-status {
      display: inline-block;
      margin-top: 12px;
      color: #e8bc63;
      background: rgba(232,188,99,0.10);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    /* ================================
       8. EDUCATION AND EXPERIENCE
    ================================= */

    .timeline-section {
      background: var(--bg-secondary);
    }

    .timeline {
      max-width: 800px;
      margin: auto;
      position: relative;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 5px;
      bottom: 5px;
      width: 2px;
      background: var(--accent);
      opacity: 0.35;
    }

    .timeline-item {
      position: relative;
      padding: 0 0 40px 45px;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 6px;
      width: 16px;
      height: 16px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0,213,255,0.5);
    }

    .timeline-item h3 {
      font-size: 19px;
      margin-bottom: 8px;
    }

    .timeline-item .place {
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
    }

    .timeline-item p {
      color: var(--muted);
      margin-top: 10px;
      font-size: 14px;
    }

    /* ================================
       9. CONTACT
    ================================= */

    .contact-grid {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 45px;
    }

    .contact-info h3 {
      font-size: 26px;
      margin-bottom: 15px;
    }

    .contact-info > p {
      color: var(--muted);
      margin-bottom: 28px;
    }

    .contact-detail {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 22px;
    }

    .contact-icon {
      min-width: 43px;
      height: 43px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--card);
      color: var(--accent);
      font-size: 18px;
    }

    .contact-detail small {
      color: var(--muted);
      display: block;
      font-size: 11px;
    }

    .contact-detail strong {
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .contact-form {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 30px;
      border-radius: 15px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      outline: none;
      font: inherit;
      font-size: 13px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }

    .form-group textarea {
      min-height: 125px;
      resize: vertical;
    }

    .form-message {
      color: var(--accent);
      font-size: 12px;
      margin-top: 12px;
    }

    /* ================================
       10. FOOTER
    ================================= */

    footer {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 35px 0;
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .footer-content p {
      font-size: 12px;
      color: var(--muted);
    }

    .social-links {
      display: flex;
      gap: 18px;
    }

    .social-links a {
      font-size: 13px;
      color: var(--muted);
    }

    .social-links a:hover {
      color: var(--accent);
    }

    /* ================================
       11. BACK TO TOP
    ================================= */

    .back-top {
      position: fixed;
      right: 22px;
      bottom: 25px;
      width: 45px;
      height: 45px;
      background: linear-gradient(110deg, #00bfe9, #416eff);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 21px;
      opacity: 0;
      visibility: hidden;
      transition: 0.3s;
      z-index: 900;
    }

    .back-top.show {
      opacity: 1;
      visibility: visible;
    }

    /* ================================
       12. ANIMATIONS
    ================================= */

    .reveal {
      opacity: 0;
      transform: translateY(25px);
      transition: 0.7s ease;
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* ================================
       13. RESPONSIVE DESIGN
    ================================= */

    @media(max-width: 900px) {
      .hero-grid {
        gap: 35px;
      }

      .projects-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .nav-links {
        gap: 14px;
      }
    }

    @media(max-width: 700px) {
      .section {
        padding: 75px 0;
      }

      .menu-toggle {
        display: block;
      }

      .nav-right {
        gap: 10px;
      }

      .nav-links {
        position: absolute;
        top: 76px;
        left: 0;
        width: 100%;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
        display: none;
        flex-direction: column;
        padding: 25px 5%;
        gap: 20px;
      }

      .nav-links.open {
        display: flex;
      }

      .hero {
        padding-top: 120px;
      }

      .hero-grid,
      .about-grid,
      .contact-grid {
        grid-template-columns: 1fr;
      }

      .hero-content {
        text-align: center;
      }

      .hero-description {
        margin-left: auto;
        margin-right: auto;
      }

      .hero-buttons {
        justify-content: center;
      }

      .hero-image-wrapper {
        max-width: 310px;
        margin-top: 20px;
      }

      .floating-card {
        left: -15px;
      }

      .about-stats {
        margin-top: 10px;
      }

      .skills-grid,
      .cert-grid {
        grid-template-columns: 1fr;
      }

      .projects-grid {
        grid-template-columns: 1fr;
