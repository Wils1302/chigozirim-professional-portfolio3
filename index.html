<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071a2e">

<title>Chigozirim Wilson Weli | Professional Portfolio</title>

<meta name="description" content="Official professional portfolio of Chigozirim Wilson Weli, Frontend Developer, UI/UX Designer, AI Specialist and Safety Officer based in Port Harcourt, Nigeria.">

<meta name="keywords" content="Chigozirim Wilson Weli, Frontend Developer, UI UX Designer, AI Specialist, Web Developer, Safety Officer, Port Harcourt">

<meta name="author" content="Chigozirim Wilson Weli">
<meta name="robots" content="index, follow">

<style>
/* =====================================
   GLOBAL SETTINGS
===================================== */

:root {
    --primary: #071a2e;
    --secondary: #102b47;
    --accent: #00b8d9;
    --accent-light: #55d8ee;
    --background: #f5f7fa;
    --surface: #ffffff;
    --text: #17283a;
    --muted: #65758a;
    --border: #dce4ec;
    --shadow: 0 12px 35px rgba(7,26,46,0.09);
}

body.dark {
    --primary: #07111e;
    --secondary: #10243a;
    --background: #081321;
    --surface: #102137;
    --text: #edf4fa;
    --muted: #a8b8ca;
    --border: #263b51;
    --shadow: 0 12px 35px rgba(0,0,0,0.25);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

html {
    scroll-padding-top: 85px;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--background);
    color: var(--text);
    line-height: 1.7;
    overflow-x: hidden;
    transition: background .3s, color .3s;
}

a {
    text-decoration: none;
    color: inherit;
}

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

img {
    max-width: 100%;
    display: block;
}

.container {
    width: 90%;
    max-width: 1180px;
    margin: auto;
}

section {
    padding: 90px 0;
}

.section-heading {
    text-align: center;
    margin-bottom: 55px;
}

.section-heading span {
    color: var(--accent);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.section-heading h2 {
    font-size: clamp(29px, 4vw, 40px);
    margin-top: 8px;
    color: var(--text);
}

.section-heading p {
    max-width: 620px;
    margin: 12px auto 0;
    color: var(--muted);
}

/* =====================================
   HEADER AND NAVIGATION
===================================== */

header {
    width: 100%;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 3px 15px rgba(0,0,0,.025);
}

.navbar {
    height: 82px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 27px;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: -1px;
}

body.dark .logo {
    color: white;
}

.logo span {
    color: var(--accent);
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 27px;
    list-style: none;
}

.nav-links a {
    color: var(--text);
    font-size: 14px;
    font-weight: 650;
    transition: .3s;
}

.nav-links a:hover,
.nav-links a.active {
    color: var(--accent);
}

.nav-actions {
    display: flex;
    align-items: center;
    gap: 12px;
}

.theme-btn,
.menu-btn {
    width: 46px;
    height: 46px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    color: var(--text);
    font-size: 20px;
    display: grid;
    place-items: center;
}

.menu-btn {
    display: none;
}

/* =====================================
   HERO SECTION
===================================== */

.hero {
    min-height: 760px;
    padding: 155px 0 90px;
    background:
        radial-gradient(circle at 85% 30%, rgba(0,184,217,.13), transparent 30%),
        linear-gradient(125deg, var(--primary), var(--secondary));
    color: white;
    display: flex;
    align-items: center;
}

.hero-grid {
    display: grid;
    grid-template-columns: 1.2fr .8fr;
    align-items: center;
    gap: 65px;
}

.hero-label {
    display: inline-block;
    color: var(--accent-light);
    font-weight: 700;
    letter-spacing: 2px;
    font-size: 13px;
    margin-bottom: 22px;
}

.hero h1 {
    font-size: clamp(39px, 5.5vw, 65px);
    line-height: 1.13;
    margin-bottom: 20px;
    letter-spacing: -2px;
}

.hero h1 span {
    color: var(--accent-light);
}

.hero h3 {
    font-size: clamp(18px, 2vw, 23px);
    font-weight: 500;
    margin-bottom: 20px;
}

.typing-text {
    color: var(--accent-light);
    font-weight: 750;
}

.hero-description {
    max-width: 610px;
    color: #d1dfeb;
    font-size: 16px;
    margin-bottom: 32px;
}

.hero-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 24px;
    border-radius: 8px;
    font-weight: 750;
    border: 2px solid var(--accent);
    transition: .3s;
}

.btn-primary {
    background: var(--accent);
    color: #061726;
}

.btn-primary:hover {
    background: transparent;
    color: white;
}

.btn-outline {
    color: white;
    background: transparent;
}

.btn-outline:hover {
    background: var(--accent);
    color: #061726;
}

.hero-visual {
    display: flex;
    justify-content: center;
    align-items: center;
}

.profile-circle {
    width: 340px;
    height: 340px;
    max-width: 100%;
    border-radius: 50%;
    border: 9px solid rgba(255,255,255,.12);
    background:
        radial-gradient(circle, #163c59, #071a2e 75%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 70px rgba(0,184,217,.15);
    position: relative;
}

.profile-circle::before {
    content: "";
    position: absolute;
    inset: -18px;
    border: 2px solid rgba(0,184,217,.4);
    border-radius: 50%;
}

.profile-initials {
    font-size: 95px;
    font-weight: 900;
    color: white;
    letter-spacing: -8px;
}

.profile-initials span {
    color: var(--accent);
}

/* =====================================
   ABOUT SECTION
===================================== */

.about-grid {
    display: grid;
    grid-template-columns: .9fr 1.1fr;
    gap: 55px;
    align-items: center;
}

.about-card {
    background: var(--primary);
    color: white;
    border-radius: 18px;
    padding: 45px 35px;
    min-height: 330px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-shadow: var(--shadow);
}

.about-card h3 {
    font-size: 28px;
    margin-bottom: 15px;
}

.about-card p {
    color: #c5d7e6;
}

.about-content h3 {
    font-size: 27px;
    margin-bottom: 18px;
}

.about-content p {
    color: var(--muted);
    margin-bottom: 18px;
}

.about-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-top: 25px;
}

.detail-item {
    padding: 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
}

.detail-item strong {
    display: block;
    color: var(--accent);
    font-size: 13px;
}

.detail-item span {
    font-size: 14px;
    overflow-wrap: anywhere;
}

/* =====================================
   EXPERIENCE HIGHLIGHTS
===================================== */

.highlights {
    background: var(--primary);
    padding: 55px 0;
}

.highlights-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 25px;
    text-align: center;
}

.highlight-item h3 {
    color: var(--accent-light);
    font-size: 35px;
    margin-bottom: 5px;
}

.highlight-item p {
    color: #d1dfeb;
    font-size: 14px;
}

/* =====================================
   SKILLS SECTION
===================================== */

.skills-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 25px;
}

.skill-card {
    background: var(--surface);
    padding: 27px;
    border: 1px solid var(--border);
    border-radius: 13px;
    box-shadow: var(--shadow);
    transition: .3s;
}

.skill-card:hover {
    transform: translateY(-5px);
    border-color: var(--accent);
}

.skill-card h3 {
    font-size: 18px;
    margin-bottom: 8px;
}

.skill-card p {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 18px;
}

.skill-bar {
    height: 8px;
    background: var(--border);
    border-radius: 20px;
    overflow: hidden;
}

.skill-progress {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
    border-radius: 20px;
    transition: width 1.5s ease;
}

.skill-card small {
    display: block;
    text-align: right;
    color: var(--accent);
    font-weight: 800;
    margin-top: 8px;
}

/* =====================================
   SERVICES SECTION
===================================== */

.services {
    background: var(--surface);
}

.services-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 25px;
}

.service-card {
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 30px;
    transition: .3s;
}

.service-card:hover {
    transform: translateY(-7px);
    border-color: var(--accent);
    box-shadow: var(--shadow);
}

.service-icon {
    width: 55px;
    height: 55px;
    background: rgba(0,184,217,.12);
    color: var(--accent);
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 25px;
    margin-bottom: 20px;
}

.service-card h3 {
    margin-bottom: 12px;
    font-size: 20px;
}

.service-card p {
    color: var(--muted);
    font-size: 14px;
}

/* =====================================
   PROJECTS SECTION
===================================== */

.projects-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 28px;
}

.project-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 15px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: .3s;
}

.project-card:hover {
    transform: translateY(-6px);
}

.project-cover {
    min-height: 210px;
    background: linear-gradient(135deg, #071a2e, #087d9b);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    text-align: center;
    color: white;
}

.project-cover h3 {
    font-size: 25px;
}

.project-content {
    padding: 25px;
}

.project-content p {
    color: var(--muted);
    margin: 12px 0;
    font-size: 14px;
}

.project-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 15px;
}

.project-tags span {
    font-size: 11px;
    padding: 6px 10px;
    background: rgba(0,184,217,.12);
    color: var(--accent);
    border-radius: 20px;
    font-weight: 700;
}

/* =====================================
   EXPERIENCE AND EDUCATION
===================================== */

.timeline-section {
    background: var(--surface);
}

.timeline {
    max-width: 800px;
    margin: auto;
    border-left: 3px solid var(--accent);
    padding-left: 30px;
}

.timeline-item {
    position: relative;
    margin-bottom: 35px;
    padding: 25px;
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: 12px;
}

.timeline-item::before {
    content: "";
    position: absolute;
    width: 15px;
    height: 15px;
    background: var(--accent);
    border-radius: 50%;
    left: -39px;
    top: 30px;
}

.timeline-item h3 {
    margin-bottom: 7px;
}

.timeline-item h4 {
    color: var(--accent);
    font-size: 14px;
    margin-bottom: 10px;
}

.timeline-item p {
    color: var(--muted);
    font-size: 14px;
}

/* =====================================
   CONTACT SECTION
===================================== */

.contact-grid {
    display: grid;
    grid-template-columns: .85fr 1.15fr;
    gap: 40px;
}

.contact-info {
    background: var(--primary);
    padding: 35px;
    border-radius: 15px;
    color: white;
}

.contact-info h3 {
    font-size: 25px;
    margin-bottom: 15px;
}

.contact-info > p {
    color: #c5d7e6;
    margin-bottom: 25px;
}

.contact-item {
    margin-bottom: 22px;
}

.contact-item strong {
    display: block;
    color: var(--accent-light);
    font-size: 13px;
}

.contact-item a,
.contact-item span {
    overflow-wrap: anywhere;
}

.contact-form {
    background: var(--surface);
    padding: 32px;
    border: 1px solid var(--border);
    border-radius: 15px;
    box-shadow: var(--shadow);
}

.contact-form h3 {
    font-size: 24px;
    margin-bottom: 22px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: 700;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 13px 15px;
    background: var(--background);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: .3s;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: var(--accent);
}

.form-group textarea {
    resize: vertical;
    min-height: 130px;
}

.contact-form button {
    width: 100%;
    border: none;
}

/* =====================================
   FOOTER
===================================== */

footer {
    background: #061526;
    color: #c5d7e6;
    padding: 40px 0;
    text-align: center;
}

.footer-logo {
    font-size: 27px;
    font-weight: 900;
    color: white;
    margin-bottom: 10px;
}

.footer-logo span {
    color: var(--accent);
}

footer p {
    font-size: 14px;
    margin-top: 8px;
}

.social-links {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin: 20px 0;
}

.social-links a {
    color: var(--accent-light);
    font-size: 14px;
    font-weight: 650;
}

.social-links a:hover {
    color: white;
}

/* =====================================
   BACK TO TOP
===================================== */

.back-to-top {
    position: fixed;
    bottom: 25px;
    right: 22px;
    width: 48px;
    height: 48px;
    background: var(--accent);
    color: #061526;
    border: none;
    border-radius: 50%;
    font-size: 22px;
    font-weight: 900;
    display: grid;
    place-items: center;
    opacity: 0;
    visibility: hidden;
    transition: .3s;
    z-index: 900;
}

.back-to-top.show {
    opacity: 1;
    visibility: visible;
}

/* =====================================
   SCROLL ANIMATIONS
===================================== */

.reveal {
    opacity: 0;
    transform: translateY(35px);
    transition: opacity .8s ease, transform .8s ease;
}

.reveal.visible {
    opacity: 1;
    transform: translateY(0);
}

/* =====================================
   MOBILE RESPONSIVENESS
===================================== */

@media(max-width: 1000px) {

    .nav-links {
        gap: 16px;
    }

    .hero-grid {
        gap: 30px;
    }

    .profile-circle {
        width: 280px;
        height: 280px;
    }

    .profile-initials {
        font-size: 75px;
    }
}

@media(max-width: 850px) {

    .menu-btn {
        display: grid;
    }

    .nav-links {
        position: absolute;
        top: 81px;
        left: 0;
        width: 100%;
        padding: 25px 5%;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: none;
        flex-direction: column;
        align-items: flex-start;
        gap: 22px;
        box-shadow: var(--shadow);
    }

    .nav-links.active {
        display: flex;
    }

    .nav-links a {
        font-size: 16px;
    }

    .hero {
        min-height: auto;
    }

    .hero-grid {
        grid-template-columns: 1fr;
        text-align: center;
    }

    .hero-description {
        margin-left: auto;
        margin-right: auto;
    }

    .hero-buttons {
        justify-content: center;
    }

    .hero-visual {
        grid-row: 1;
    }

    .profile-circle {
        width: 240px;
        height: 240px;
    }

    .profile-initials {
        font-size: 65px;
    }

    .about-grid,
    .contact-grid {
        grid-template-columns: 1fr;
    }

    .services-grid {
        grid-template-columns: repeat(2,1fr);
    }
}

@media(max-width: 550px) {

    .container {
        width: 90%;
    }

    section {
        padding: 65px 0;
    }

    .logo {
        font-size: 23px;
    }

    .navbar {
        height: 75px;
    }

    .nav-links {
        top: 74px;
    }

    .theme-btn,
    .menu-btn {
        width: 42px;
        height: 42px;
    }

    .hero {
        padding: 125px 0 65px;
    }

    .hero h1 {
        font-size: 40px;
        letter-spacing: -1.5px;
    }

    .hero h3 {
        font-size: 18px;
    }

    .hero-description {
        font-size: 14px;
    }

    .profile-circle {
        width: 205px;
        height: 205px;
    }

    .profile-initials {
        font-size: 58px;
    }

    .about-card {
        padding: 30px 25px;
    }

    .about-details {
        grid-template-columns: 1fr;
    }

    .highlights-grid {
        grid-template-columns: 1fr;
        gap: 30px;
    }

    .skills-grid,
    .services-grid,
    .projects-grid {
        grid-template-columns: 1fr;
    }

    .contact-form,
    .contact-info {
        padding: 24px 20px;
    }

    .section-heading {
        margin-bottom: 35px;
    }

    .section-heading h2 {
        font-size: 30px;
    }

    .timeline {
        padding-left: 22px;
    }

    .timeline-item::before {
        left: -31px;
    }

    .btn {
        padding: 12px 18px;
        font-size: 13px;
    }
}

/* =====================================
   PRINT / CV DOWNLOAD
===================================== */

@media print {

    header,
    .back-to-top,
    .hero-buttons,
    .contact-grid,
    footer,
    .highlights,
    .services,
    .projects-section,
    .theme-btn,
    .menu-btn {
        display: none !important;
    }

    body {
        background: white !important;
        color: black !important;
    }

    section {
        padding: 15px 0 !important;
        break-inside: avoid;
    }

    .container {
        width: 100%;
        max-width: 100%;
    }

    .hero {
        min-height: auto;
        padding: 20px 0;
        background: white !important;
        color: black !important;
    }

    .hero-grid {
        display: block;
    }

    .hero-visual {
        display: none;
    }

    .hero-description,
    .about-content p,
    .timeline-item p {
        color: #333 !important;
    }

    .hero h1,
    .hero h3,
    .about-content h3,
    .section-heading h2,
    .timeline-item h3 {
        color: black !important;
    }

    .profile-circle,
    .about-card {
        display: none;
    }

    .skill-card,
    .timeline-item,
    .detail-item {
        box-shadow: none;
        background: white !important;
        color: black !important;
    }

    .reveal {
        opacity: 1 !important;
        transform: none !important;
    }
}

</style>
</head>

     HEADER
===================================== -->

    <div class="container navbar">

        <a href="#home" class="logo">
            W<span>.</span>WELI
        </a>

        <ul class="nav-links" id="navLinks">
            <li><a href="#home" class="active">Home</a></li>

            <li><a href="#services">Services</a></li>
            <li><a href="#projects">Projects</a></li>

            </button>

                aria-label="Open navigation menu"
                aria-expanded="false">

            </button>

        </div>

    </div>
</header>


<!-- ===========
